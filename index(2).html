<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Kennzeichen-Sammler</title>
<style>
/* =========================================================
   1. FARBEN & THEMES (Light / Dark)
   ========================================================= */
:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-2: #e2e8f0;
  --text: #0f172a;
  --muted: #64748b;
  --border: #cbd5e1;
  --accent: #2563eb;
  --accent-soft: #dbeafe;
  --ok: #16a34a;
  --ok-soft: #dcfce7;
  --danger: #dc2626;
  --eu: #0b3d91;
  --shadow: 0 1px 3px rgba(15,23,42,.08), 0 4px 14px rgba(15,23,42,.06);
  --radius: 14px;
  --nav-h: 64px;
}
[data-theme="dark"] {
  --bg: #0b1120;
  --surface: #131c2e;
  --surface-2: #1e293b;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --border: #2b3a52;
  --accent: #60a5fa;
  --accent-soft: #1e3a5f;
  --ok: #22c55e;
  --ok-soft: #0f3a24;
  --danger: #f87171;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; overflow-x: hidden; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.4;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
}
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 14px; }
.hidden { display: none !important; }

/* =========================================================
   2. KOPFBEREICH mit Gesamtfortschritt
   ========================================================= */
header.top {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  padding-top: env(safe-area-inset-top);
  border-bottom: 1px solid var(--border);
}
.progress-head { display: flex; align-items: center; gap: 14px; padding: 12px 0 10px; }
.car-chip {
  width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; overflow: hidden; padding: 0;
  border: 2px solid var(--border); background: #fff; display: grid; place-items: center;
}
.car-chip img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 6px; }
.car-chip.wide { width: 74px; }
.car-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

/* ---------- Auto-Auswahl beim Start ---------- */
#picker {
  position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: center;
  background: radial-gradient(ellipse at 50% 35%, #2a303b 0%, #0d1118 70%);
  color: #e2e8f0; padding: calc(env(safe-area-inset-top) + 16px) 0 calc(env(safe-area-inset-bottom) + 20px);
  transition: opacity .3s, transform .3s;
}
#picker.closing { opacity: 0; transform: scale(1.03); pointer-events: none; }
#picker h2 { text-align: center; margin: 0 0 4px; font-size: 24px; letter-spacing: -.3px; }
#picker .lead { text-align: center; margin: 0 0 12px; color: #94a3b8; font-size: 15px; }
.track {
  display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  padding: 10px calc(50vw - min(42vw, 28vh, 220px)); -webkit-overflow-scrolling: touch;
}
.track::-webkit-scrollbar { display: none; }
.slide {
  flex: 0 0 min(84vw, 56vh, 440px); scroll-snap-align: center; border: 0; padding: 0; background: none; color: inherit;
  text-align: center; transition: transform .25s, opacity .25s; transform: scale(.9); opacity: .5;
}
.slide.active { transform: scale(1); opacity: 1; }
.slide .photo {
  display: block; border-radius: 22px; overflow: hidden; aspect-ratio: 1 / 1;
  box-shadow: 0 18px 40px rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.08);
}
.slide .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slide .who { display: block; margin-top: 14px; font-size: 17px; font-weight: 650; }
.slide .model { display: block; font-size: 13px; color: #94a3b8; margin-top: 2px; }
.dots { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
.dots i { width: 8px; height: 8px; border-radius: 99px; background: #475569; transition: .25s; }
.dots i.on { width: 22px; background: #e2e8f0; }
.pick-nav { display: flex; justify-content: center; gap: 12px; margin-top: 18px; }
.pick-nav { align-items: center; gap: 18px; }
.pick-nav button {
  width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #cbd5e1;
  transition: background .2s, border-color .2s;
}
.pick-nav button:hover { background: rgba(255,255,255,.12); }
.pick-nav button.go { width: 58px; height: 58px; border-color: rgba(255,255,255,.35); color: #fff; }
.pick-nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.pick-nav .go svg { width: 26px; height: 26px; }
@media (hover: none) { .pick-nav .arrow { display: none; } }

.progress-head h1 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 600; }
.count { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
.count small { font-size: 15px; color: var(--muted); font-weight: 600; }
.pct { margin-left: auto; font-size: 26px; font-weight: 800; color: var(--accent); }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok)); border-radius: 99px; transition: width .3s; }
.progress-head + .bar { margin-bottom: 12px; }

/* Suche & Filter */
.search {
  position: relative; display: flex; align-items: stretch;
  width: 100%; max-width: 280px; height: 68px; margin: 0 auto 12px;
  background: #fff; border: 3px solid #111; border-radius: 9px; overflow: hidden;
  box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow);
}
.search:focus-within { box-shadow: 0 0 0 4px var(--accent), var(--shadow); }
.search .eu {
  width: 30px; flex-shrink: 0; background: var(--eu); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 6px 0 4px; font: 700 15px/1 Arial, sans-serif;
}
.search .eu svg { width: 20px; height: 20px; }
.search input {
  flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #000;
  text-align: center; text-transform: uppercase; padding: 0 40px 0 6px;
  font-family: "DIN 1451 Mittelschrift", "DIN Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  font-weight: 700; font-size: 38px; letter-spacing: 2px;
}
.search input::placeholder { color: #c4c9d1; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.search .clear {
  position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
  width: 40px; height: 48px; border: 0; background: none; font-size: 22px; color: #64748b;
}
.filters { display: flex; gap: 8px; padding-bottom: 12px; flex-wrap: wrap; justify-content: center; }
.chips { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.chips button {
  border: 0; background: none; padding: 10px 14px; border-radius: 9px;
  font-weight: 600; font-size: 14px; color: var(--muted); min-height: 42px;
}
.chips button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
select {
  flex: 1; min-width: 150px; min-height: 48px; font-size: 15px; padding: 0 12px;
  border: 2px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text);
}

/* =========================================================
   3. KENNZEICHEN-OPTIK (wie echtes deutsches Schild)
   ========================================================= */
.plate {
  display: inline-flex; align-items: stretch; flex-shrink: 0;
  height: 44px; min-width: 96px;
  background: #fff; color: #000;
  border: 2.5px solid #111; border-radius: 6px; overflow: hidden;
  box-shadow: inset 0 0 0 1.5px #fff, 0 1px 2px rgba(0,0,0,.25);
}
.plate .eu {
  width: 20px; background: var(--eu); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 3px 0 2px; font: 700 11px/1 Arial, sans-serif;
}
.plate .eu svg { width: 14px; height: 14px; }
.plate .code {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 10px;
  font-family: "DIN 1451 Mittelschrift", "DIN Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif;
  font-weight: 700; font-size: 28px; letter-spacing: 1px; font-stretch: condensed;
}
.plate .seals { display: flex; flex-direction: column; gap: 2px; }
.plate .seals i { width: 9px; height: 9px; border-radius: 50%; display: block; }
.plate .seals i:first-child { background: #c9a227; }
.plate .seals i:last-child { background: #9aa4b2; }
.plate.big { height: 64px; min-width: 150px; }
.plate.big .eu { width: 28px; font-size: 14px; }
.plate.big .eu svg { width: 20px; height: 20px; }
.plate.big .code { font-size: 42px; }

/* =========================================================
   4. LISTE
   ========================================================= */
.list { list-style: none; margin: 12px 0; padding: 0; display: grid; grid-template-columns: minmax(0,1fr); gap: 8px; }
.list > li { min-width: 0; }
.item {
  display: flex; align-items: center; gap: 14px; width: 100%;
  min-height: 72px; padding: 12px 14px;
  background: var(--surface); border: 2px solid transparent; border-radius: var(--radius);
  box-shadow: var(--shadow); text-align: left;
  transition: transform .08s, border-color .2s, background .2s;
}
.item:active { transform: scale(.985); }
.item .info { flex: 1; min-width: 0; }
.item .ort { display: block; font-weight: 650; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .check {
  width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%;
  border: 2.5px solid var(--border); display: grid; place-items: center;
  color: transparent; font-weight: 900; font-size: 18px;
}
.item.done { border-color: var(--ok); background: var(--ok-soft); }
.item.done .check { background: var(--ok); border-color: var(--ok); color: #fff; }
.badge {
  display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 2px;
}
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.result-info { font-size: 13px; color: var(--muted); margin-top: 12px; }

/* =========================================================
   5. STATISTIK / VERLAUF / DATEN
   ========================================================= */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin: 14px 0; }
.card h2 { margin: 0 0 12px; font-size: 18px; }
.land-row {
  display: block; width: 100%; border: 0; background: none; text-align: left;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.land-row:last-child { border-bottom: 0; }
.land-row .line { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-size: 15px; }
.land-row .line b { font-weight: 650; }
.land-row .line span { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.land-row.complete .line b::after { content: " ✓"; color: var(--ok); }
.history-item { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.history-item:last-child { border-bottom: 0; }
.history-item .when { font-size: 13px; color: var(--muted); }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat-grid div { background: var(--surface-2); border-radius: 12px; padding: 12px; text-align: center; }
.stat-grid b { display: block; font-size: 22px; }
.stat-grid span { font-size: 12px; color: var(--muted); }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 52px; margin: 8px 0; border-radius: 12px;
  border: 2px solid var(--border); background: var(--surface); font-weight: 650; font-size: 16px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: none; }
.hint { font-size: 13px; color: var(--muted); margin: 4px 0 0; }

/* =========================================================
   6. NAVIGATION (unten, daumenfreundlich)
   ========================================================= */
nav.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.bottom .wrap { display: flex; padding: 0; }
nav.bottom button {
  flex: 1; height: var(--nav-h); border: 0; background: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; font-weight: 600; color: var(--muted);
}
nav.bottom button .ico svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
nav.bottom button.active { color: var(--accent); }

/* =========================================================
   7. DIALOG & TOAST
   ========================================================= */
dialog {
  border: 0; border-radius: 18px; padding: 22px; width: min(92vw, 400px);
  background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.35);
}
dialog::backdrop { background: rgba(2,6,23,.55); }
dialog h3 { margin: 14px 0 6px; font-size: 19px; }
dialog p { margin: 0 0 6px; color: var(--muted); }
dialog .actions { display: flex; gap: 10px; margin-top: 18px; }
dialog .actions .btn { margin: 0; }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);
  transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: #0f172a; color: #fff; border-radius: 12px; padding: 6px 6px 6px 16px;
  display: flex; align-items: center; gap: 12px; z-index: 40; transition: .2s;
  width: max-content; max-width: 92vw; box-shadow: 0 8px 24px rgba(0,0,0,.3);
}
[data-theme="dark"] .toast { background: #e2e8f0; color: #0f172a; }
.toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
.toast button { border: 0; background: none; color: #60a5fa; font-weight: 700; padding: 10px 12px; min-height: 44px; }
[data-theme="dark"] .toast button { color: #1d4ed8; }

@media (min-width: 700px) {
  .list { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .item:hover { border-color: var(--accent); }
  .item.done:hover { border-color: var(--danger); }
}
</style>
</head>
<body>

<div id="picker" role="dialog" aria-label="Auto auswählen">
  <h2>In welchem Auto sitzt du?</h2>
  <p class="lead">Wischen und antippen</p>
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
  <div class="pick-nav">
    <button class="arrow" id="prevCar" aria-label="Vorheriges Auto"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
    <button class="go" id="goCar" aria-label="Auto auswählen"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>
    <button class="arrow" id="nextCar" aria-label="Nächstes Auto"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
  </div>
</div>

<header class="top">
  <div class="wrap">
    <div class="progress-head">
      <button class="car-chip" id="carChip" aria-label="Auto wechseln"></button>
      <div>
        <h1>Kennzeichen-Sammler</h1>
        <div class="car-sub" id="carSub"></div>
        <div class="count"><span id="cnt">0</span> <small>/ <span id="total">0</span></small></div>
      </div>
      <div class="pct" id="pct">0 %</div>
    </div>
    <div class="bar"><i id="bar" style="width:0"></i></div>

    <div id="listControls">
      <div class="search">
        <span class="eu" id="qEu"></span>
        <input id="q" type="search" inputmode="text" enterkeyhint="done" autocomplete="off" autocorrect="off"
               autocapitalize="characters" spellcheck="false" maxlength="6"
               placeholder="OS" aria-label="Kürzel suchen">
        <button class="clear hidden" id="clearQ" aria-label="Suche leeren">✕</button>
      </div>
      <div class="filters">
        <div class="chips" id="statusChips">
          <button data-f="alle" class="active">Alle</button>
          <button data-f="fehlend">Fehlend</button>
          <button data-f="gesammelt">Gesammelt</button>
        </div>
        <select id="landSel" aria-label="Bundesland"></select>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="view-liste">
    <div class="result-info" id="resultInfo"></div>
    <ul class="list" id="list"></ul>
  </section>

  <section id="view-stats" class="hidden">
    <div class="card">
      <h2>Übersicht</h2>
      <div class="stat-grid" id="statGrid"></div>
    </div>
    <div class="card">
      <h2>Nach Bundesland</h2>
      <div id="landStats"></div>
    </div>
  </section>

  <section id="view-verlauf" class="hidden">
    <div class="card">
      <h2>Zuletzt gesammelt</h2>
      <div id="history"></div>
    </div>
  </section>

  <section id="view-daten" class="hidden">
    <div class="card">
      <h2>Backup</h2>
      <button class="btn primary" id="exportBtn">Backup exportieren (JSON)</button>
      <button class="btn" id="importBtn">Backup importieren</button>
      <input type="file" id="importFile" accept="application/json,.json" class="hidden">
      <p class="hint" id="syncInfo">Gespeichert nur in diesem Browser.</p>
      <p class="hint">Ein Backup als JSON-Datei schadet trotzdem nie.</p>
    </div>
    <div class="card">
      <h2>Darstellung</h2>
      <div class="chips" id="themeChips" style="width:max-content">
        <button data-t="auto">Automatisch</button>
        <button data-t="light">Hell</button>
        <button data-t="dark">Dunkel</button>
      </div>
    </div>
    <div class="card">
      <h2>Zurücksetzen</h2>
      <button class="btn danger" id="resetBtn">Alle gesammelten Kennzeichen löschen</button>
    </div>
  </section>
</main>

<nav class="bottom">
  <div class="wrap">
    <button data-v="liste" class="active"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span>Sammeln</button>
    <button data-v="stats"><span class="ico"><svg viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg></span>Statistik</button>
    <button data-v="verlauf"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>Verlauf</button>
    <button data-v="daten"><span class="ico"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></span>Daten</button>
  </div>
</nav>

<dialog id="dlg">
  <div id="dlgPlate"></div>
  <h3 id="dlgTitle"></h3>
  <p id="dlgText"></p>
  <div class="actions">
    <button class="btn" id="dlgCancel">Abbrechen</button>
    <button class="btn danger" id="dlgOk">Entfernen</button>
  </div>
</dialog>

<div class="toast" id="toast"><span id="toastText"></span><button id="toastUndo">Rückgängig</button></div>

<script>
/* =========================================================================
   KENNZEICHEN-DATEN
   -------------------------------------------------------------------------
   Hier kannst du die Liste erweitern oder korrigieren.
   Felder:
     kz       – Unterscheidungszeichen (eindeutig!)
     ort      – heutige Stadt / heutiger Kreis, in dem das Kürzel ausgegeben wird
     land     – Bundesland-Kürzel (siehe LAENDER weiter unten)
     herkunft – wofür die Buchstaben stehen
     alt      – optional: true = wieder eingeführtes Altkennzeichen
   ========================================================================= */
const KENNZEICHEN = [
  // ---------- Baden-Württemberg ----------
  {"kz":"AA","ort":"Ostalbkreis","land":"BW","herkunft":"Aalen"},
  {"kz":"BAD","ort":"Baden-Baden","land":"BW","herkunft":"Baden-Baden"},
  {"kz":"BB","ort":"Landkreis Böblingen","land":"BW","herkunft":"Böblingen"},
  {"kz":"BC","ort":"Landkreis Biberach","land":"BW","herkunft":"Biberach an der Riß"},
  {"kz":"BL","ort":"Zollernalbkreis","land":"BW","herkunft":"Balingen"},
  {"kz":"BÜS","ort":"Büsingen am Hochrhein (Landkreis Konstanz)","land":"BW","herkunft":"Büsingen – deutsche Exklave in der Schweiz"},
  {"kz":"CW","ort":"Landkreis Calw","land":"BW","herkunft":"Calw"},
  {"kz":"EM","ort":"Landkreis Emmendingen","land":"BW","herkunft":"Emmendingen"},
  {"kz":"ES","ort":"Landkreis Esslingen","land":"BW","herkunft":"Esslingen am Neckar"},
  {"kz":"FDS","ort":"Landkreis Freudenstadt","land":"BW","herkunft":"Freudenstadt"},
  {"kz":"FN","ort":"Bodenseekreis","land":"BW","herkunft":"Friedrichshafen"},

/* Bundesländer: Kürzel → Anzeigename (Reihenfolge = Reihenfolge in Statistik & Filter) */
const LAENDER = {
  BW: "Baden-Württemberg", BY: "Bayern", BE: "Berlin", BB: "Brandenburg",
  HB: "Bremen", HH: "Hamburg", HE: "Hessen", MV: "Mecklenburg-Vorpommern",
  NI: "Niedersachsen", NW: "Nordrhein-Westfalen", RP: "Rheinland-Pfalz", SL: "Saarland",
  SN: "Sachsen", ST: "Sachsen-Anhalt", SH: "Schleswig-Holstein", TH: "Thüringen",
  BUND: "Bundesbehörden & Sonder"
};

/* =========================================================================
   SPEICHER (localStorage)
   Format: { collected: { "M": "2026-11-12T20:49:00.000Z", ... }, theme: "auto" }
   ========================================================================= */
const STORE_KEY = "kennzeichen-sammler-v1";

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY));
    if (raw && typeof raw.collected === "object") return { collected: raw.collected, cars: raw.cars || {}, car: raw.car || null, theme: raw.theme || "auto" };
  } catch (e) { /* defekte oder fehlende Daten → neu starten */ }
  return { collected: {}, cars: {}, car: null, theme: "auto" };
}
function saveState(fromRemote) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* z. B. privater Modus */ }
  if (!fromRemote) pushRemote();
}

/* =========================================================================
   CLOUD-SYNC (nur wenn die App als Claude-Artifact läuft)
   Gespeichert wird ein privates Dokument pro Person: data/users/<id>/sammlung
   Lokal (Datei im Browser) fällt das einfach weg – dann gilt nur localStorage.
   ========================================================================= */
let remoteRef = null, remoteWriting = false, remotePending = false, syncStatus = "lokal";

function pushRemote() {
  if (!remoteRef) return;
  if (remoteWriting) { remotePending = true; return; }
  remoteWriting = true;
  remoteRef.set({ collected: state.collected, cars: state.cars, updatedAt: new Date().toISOString() })
    .then(() => setSync("sync"))
    .catch(e => setSync(e && e.code === "invalid_argument" ? "lokal" : "fehler"))
    .finally(() => {
      remoteWriting = false;
      if (remotePending) { remotePending = false; pushRemote(); }
    });
}

function setSync(st) {
  syncStatus = st;
  const el = $("syncInfo"); if (!el) return;
  el.textContent = {
    lokal: "Gespeichert nur in diesem Browser.",
    laden: "Verbinde mit deinem Claude-Konto …",
    sync: "Synchronisiert mit deinem Claude-Konto – auf Handy und Laptop gleich.",
    fehler: "Synchronisierung gerade nicht erreichbar – lokal gespeichert."
  }[st];
}

async function initSync() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    remoteRef = db.doc("data/users/" + uid + "/sammlung");
    setSync("laden");
    let first = true;
    const timer = setTimeout(() => setSync("fehler"), 10000);
    remoteRef.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return;
      if (!snap.metadata.fromCache) clearTimeout(timer);
      const remote = snap.exists ? (snap.data().collected || {}) : {};
      const remoteCars = snap.exists ? (snap.data().cars || {}) : {};
      if (first && !snap.metadata.fromCache) {
        first = false;
        // Erste Verbindung: lokal und online zusammenführen
        const merged = { ...remote };
        for (const [kz, iso] of Object.entries(state.collected)) if (!merged[kz]) merged[kz] = iso;
        const changed = JSON.stringify(merged) !== JSON.stringify(remote);
        state.collected = merged; state.cars = { ...state.cars, ...remoteCars };
        saveState(true);
        if (changed) pushRemote(); else setSync("sync");
      } else if (!first) {
        state.collected = { ...remote }; state.cars = { ...remoteCars };
        saveState(true);
        setSync("sync");
      }
      renderAll();
    }, () => { clearTimeout(timer); setSync("fehler"); });
  } catch (e) { setSync("lokal"); }
}

let state = loadState();
const ui = { view: "liste", filter: "alle", land: "", q: "" };
const BY_KZ = Object.fromEntries(KENNZEICHEN.map(k => [k.kz, k]));

/* =========================================================================
   HILFSFUNKTIONEN
   ========================================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Kürzel normalisieren: Groß-/Kleinschreibung, Leerzeichen und Umlaute egal ("mu" findet "MÜ", "bd1" findet "BD 1")
const norm = s => String(s).toUpperCase().replace(/[\s-]/g, "")
  .replace(/Ä/g, "A").replace(/Ö/g, "O").replace(/Ü/g, "U");
const fmtDate = iso => new Date(iso).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
const pctStr = (a, b) => pct(a, b).toLocaleString("de-DE") + " %";

// EU-Sternenkranz als kleines SVG
const STARS = (() => {
  let c = "";
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    c += `<circle cx="${(10 + 7 * Math.cos(a)).toFixed(2)}" cy="${(10 + 7 * Math.sin(a)).toFixed(2)}" r="1.3" fill="#ffcc00"/>`;
  }
  return `<svg viewBox="0 0 20 20" aria-hidden="true">${c}</svg>`;
})();
const plateHTML = (kz, big) =>
  `<span class="plate${big ? " big" : ""}" aria-label="Kennzeichen ${esc(kz)}">
     <span class="eu">${STARS}<span>D</span></span>
     <span class="code">${esc(kz)}<span class="seals"><i></i><i></i></span></span>
   </span>`;

// Precomputed Suchtexte
const SEARCH = KENNZEICHEN.map(k => ({ k, kz: norm(k.kz) }));

/* =========================================================================
   RENDERING
   ========================================================================= */
function filtered() {
  const q = norm(ui.q.trim());
  let rows = SEARCH.filter(r => {
    if (ui.land && r.k.land !== ui.land) return false;
    const done = !!state.collected[r.k.kz];
    if (ui.filter === "gesammelt" && !done) return false;
    if (ui.filter === "fehlend" && done) return false;
    if (!q) return true;
    return r.kz.startsWith(q);
  });
  if (q) {
    // Ranking: exakter Treffer > Kürzel beginnt mit … > Ortsname
    const rank = r => r.kz === q ? 0 : 1;
    rows.sort((a, b) => rank(a) - rank(b) || a.k.kz.localeCompare(b.k.kz, "de", { numeric: true }));
  } else {
    rows.sort((a, b) => a.k.kz.localeCompare(b.k.kz, "de", { numeric: true }));
  }
  return rows.map(r => r.k);
}

function renderList() {
  const rows = filtered();
  $("resultInfo").textContent = `${rows.length} ${rows.length === 1 ? "Kennzeichen" : "Kennzeichen"}` +
    (ui.q || ui.land || ui.filter !== "alle" ? " gefunden" : "");
  if (!rows.length) {
    $("list").innerHTML = `<li class="empty">Kein Kürzel gefunden.</li>`;
    return;
  }
  $("list").innerHTML = rows.map(k => {
    const when = state.collected[k.kz];
    const meta = when ? "✓ " + fmtDate(when) : `${k.herkunft} · ${LAENDER[k.land]}`;
    return `<li><button class="item${when ? " done" : ""}" data-kz="${esc(k.kz)}">
      ${plateHTML(k.kz)}
      <span class="info">
        <span class="ort">${esc(k.ort)}${k.alt ? '<span class="badge">Alt</span>' : ""}${k.dienst ? '<span class="badge">Dienst</span>' : ""}</span>
        <span class="meta" style="display:block">${esc(meta)}</span>
      </span>
      <span class="check">✓</span>
    </button></li>`;
  }).join("");
}

function renderHeader() {
  const n = Object.keys(state.collected).filter(kz => BY_KZ[kz]).length;
  const t = KENNZEICHEN.length;
  $("cnt").textContent = n;
  $("total").textContent = t;
  $("pct").textContent = pctStr(n, t);
  $("bar").style.width = pct(n, t) + "%";
}

function renderStats() {
  const total = KENNZEICHEN.length;
  const n = KENNZEICHEN.filter(k => state.collected[k.kz]).length;
  const altTotal = KENNZEICHEN.filter(k => k.alt).length;
  const altN = KENNZEICHEN.filter(k => k.alt && state.collected[k.kz]).length;
  let completeLands = 0;
  const rows = Object.entries(LAENDER).map(([code, name]) => {
    const all = KENNZEICHEN.filter(k => k.land === code);
    const got = all.filter(k => state.collected[k.kz]).length;
    if (all.length && got === all.length) completeLands++;
    return `<button class="land-row${got === all.length && all.length ? " complete" : ""}" data-land="${code}">
      <div class="line"><b>${esc(name)}</b><span>${got} / ${all.length} · ${pctStr(got, all.length)}</span></div>
      <div class="bar"><i style="width:${pct(got, all.length)}%"></i></div>
    </button>`;
  }).join("");
  $("landStats").innerHTML = rows;
  $("statGrid").innerHTML = `
    <div><b>${n}</b><span>gesammelt</span></div>
    <div><b>${total - n}</b><span>fehlen noch</span></div>
    <div><b>${completeLands}</b><span>Länder komplett</span></div>
    <div><b>${KENNZEICHEN.filter(k => !k.alt && state.collected[k.kz]).length}</b><span>Hauptkennz.</span></div>
    <div><b>${altN} / ${altTotal}</b><span>Altkennzeichen</span></div>
    <div><b>${todayCount()}</b><span>heute</span></div>`;
}
function todayCount() {
  const d = new Date().toDateString();
  return Object.values(state.collected).filter(iso => new Date(iso).toDateString() === d).length;
}

function renderHistory() {
  const list = Object.entries(state.collected)
    .filter(([kz]) => BY_KZ[kz])
    .sort((a, b) => b[1].localeCompare(a[1]))
    .slice(0, 100);
  $("history").innerHTML = list.length ? list.map(([kz, iso]) => {
    const k = BY_KZ[kz];
    return `<div class="history-item">${plateHTML(kz)}<div><div class="ort">${esc(k.ort)}</div><div class="when">${fmtDate(iso)}${state.cars[kz] && AUTO_BY_ID[state.cars[kz]] ? " · im " + esc(AUTO_BY_ID[state.cars[kz]].modell) : ""}</div></div></div>`;
  }).join("") : `<p class="empty">Noch nichts gesammelt. Los geht's! 🚗</p>`;
}

function renderAll() {
  renderHeader();
  if (ui.view === "liste") renderList();
  if (ui.view === "stats") renderStats();
  if (ui.view === "verlauf") renderHistory();
}

/* =========================================================================
   AKTIONEN
   ========================================================================= */
let toastTimer, lastCollected = null;

function collect(kz) {
  state.collected[kz] = new Date().toISOString();
  if (state.car) state.cars[kz] = state.car;
  saveState();
  lastCollected = kz;
  showToast(`${kz} gesammelt 🎉`, true);
  if (navigator.vibrate) navigator.vibrate(30);
  renderAll();
}

function showToast(text, withUndo) {
  $("toastText").textContent = text;
  $("toastUndo").classList.toggle("hidden", !withUndo);
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 4000);
}

// Sicherheitsabfrage – liefert Promise<boolean>
function confirmDialog({ kz, title, text, ok = "Entfernen" }) {
  return new Promise(resolve => {
    const d = $("dlg");
    $("dlgPlate").innerHTML = kz ? plateHTML(kz, true) : "";
    $("dlgTitle").textContent = title;
    $("dlgText").textContent = text;
    $("dlgOk").textContent = ok;
    const done = val => { d.close(); $("dlgOk").onclick = $("dlgCancel").onclick = null; resolve(val); };
    $("dlgOk").onclick = () => done(true);
    $("dlgCancel").onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };
    $("toast").classList.remove("show");
    d.showModal();
  });
}

async function askRemove(kz) {
  const k = BY_KZ[kz];
  const ok = await confirmDialog({
    kz,
    title: `${kz} wieder entfernen?`,
    text: `${k.ort} – gesammelt am ${fmtDate(state.collected[kz])}.`
  });
  if (ok) {
    delete state.collected[kz]; delete state.cars[kz];
    saveState();
    showToast(`${kz} entfernt`, false);
    renderAll();
  }
}

function setView(v) {
  ui.view = v;
  ["liste", "stats", "verlauf", "daten"].forEach(x => $("view-" + x).classList.toggle("hidden", x !== v));
  $("listControls").classList.toggle("hidden", v !== "liste");
  document.querySelectorAll("nav.bottom button").forEach(b => b.classList.toggle("active", b.dataset.v === v));
  window.scrollTo(0, 0);
  renderAll();
  focusSearch();
}

function applyTheme() {
  const t = state.theme === "auto"
    ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
    : state.theme;
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#0b1120" : "#f1f5f9";
  document.querySelectorAll("#themeChips button").forEach(b => b.classList.toggle("active", b.dataset.t === state.theme));
}

/* ---------- Export / Import ---------- */
async function exportData() {
  const data = {
    app: "kennzeichen-sammler",
    version: 1,
    exportiertAm: new Date().toISOString(),
    anzahl: Object.keys(state.collected).length,
    collected: state.collected,
    cars: state.cars
  };
  const json = JSON.stringify(data, null, 2);
  const filename = `kennzeichen-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const dl = window.claude && typeof window.claude.use === "function" ? await claude.use("downloads").catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename, data: json }); } catch (e) { showToast("Export abgebrochen", false); }
    return;
  }
  const blob = new Blob([json], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function importData(file) {
  try {
    const data = JSON.parse(await file.text());
    const col = data && data.collected;
    if (!col || typeof col !== "object") throw new Error("Kein gültiges Backup");
    const clean = {};
    for (const [kz, iso] of Object.entries(col)) {
      if (typeof kz === "string" && !isNaN(Date.parse(iso))) clean[kz] = new Date(iso).toISOString();
    }
    const n = Object.keys(clean).length;
    const ok = await confirmDialog({
      title: "Backup importieren?",
      text: `Das Backup enthält ${n} Kennzeichen. Deine aktuellen Daten (${Object.keys(state.collected).length}) werden dadurch ersetzt.`,
      ok: "Ersetzen"
    });
    if (!ok) return;
    state.collected = clean;
    state.cars = (data.cars && typeof data.cars === "object") ? data.cars : {};
    saveState();
    showToast(`${n} Kennzeichen importiert`, false);
    renderAll();
  } catch (e) {
    showToast("Import fehlgeschlagen: " + e.message, false);
  }
}

/* =========================================================================
   EVENTS
   ========================================================================= */
$("list").addEventListener("click", e => {
  const btn = e.target.closest(".item");
  if (!btn) return;
  const kz = btn.dataset.kz;
  if (state.collected[kz]) { askRemove(kz); return; }
  collect(kz);
  if (ui.q) { ui.q = ""; $("q").value = ""; $("clearQ").classList.add("hidden"); renderList(); }
  focusSearch();
});

$("q").addEventListener("input", e => {
  ui.q = e.target.value;
  $("clearQ").classList.toggle("hidden", !ui.q);
  renderList();
});
// Enter: obersten (noch nicht gesammelten) Treffer abhaken – praktisch am Laptop
$("q").addEventListener("keydown", e => {
  if (e.key !== "Enter" || !ui.q.trim()) return;
  const top = filtered()[0];
  if (top && !state.collected[top.kz] && norm(top.kz) === norm(ui.q.trim())) {
    collect(top.kz);
    ui.q = ""; $("q").value = ""; $("clearQ").classList.add("hidden");
    renderList();
  }
});
$("clearQ").addEventListener("click", () => {
  ui.q = ""; $("q").value = ""; $("clearQ").classList.add("hidden");
  renderList(); $("q").focus();
});

$("statusChips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  ui.filter = b.dataset.f;
  document.querySelectorAll("#statusChips button").forEach(x => x.classList.toggle("active", x === b));
  renderList();
});

$("landSel").innerHTML = `<option value="">Alle Bundesländer</option>` +
  Object.entries(LAENDER).map(([c, n]) => `<option value="${c}">${esc(n)}</option>`).join("");
$("landSel").addEventListener("change", e => { ui.land = e.target.value; renderList(); });

$("landStats").addEventListener("click", e => {
  const b = e.target.closest(".land-row"); if (!b) return;
  ui.land = b.dataset.land; $("landSel").value = ui.land;
  setView("liste");
});

document.querySelector("nav.bottom").addEventListener("click", e => {
  const b = e.target.closest("button"); if (b) setView(b.dataset.v);
});

$("toastUndo").addEventListener("click", () => {
  if (lastCollected) { delete state.collected[lastCollected]; delete state.cars[lastCollected]; saveState(); lastCollected = null; }
  $("toast").classList.remove("show");
  renderAll();
});

$("exportBtn").addEventListener("click", exportData);
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", e => {
  if (e.target.files[0]) importData(e.target.files[0]);
  e.target.value = "";
});
$("resetBtn").addEventListener("click", async () => {
  const ok = await confirmDialog({
    title: "Wirklich alles löschen?",
    text: `${Object.keys(state.collected).length} gesammelte Kennzeichen gehen verloren. Tipp: Vorher exportieren.`,
    ok: "Alles löschen"
  });
  if (ok) { state.collected = {}; saveState(); renderAll(); showToast("Alle Daten gelöscht", false); }
});

$("themeChips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.theme = b.dataset.t; saveState(); applyTheme();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

const AUTO_BY_ID = Object.fromEntries(AUTOS.map(a => [a.id, a]));
let pickIndex = 0;

function buildPicker() {
  $("track").innerHTML = AUTOS.map((a, i) => `
    <button class="slide" data-i="${i}" aria-label="${esc(a.fahrer)}, ${esc(a.modell)}">
      <span class="photo"><img src="${a.bild}" alt="${esc(a.modell)}" draggable="false"></span>
      <span class="who">${esc(a.fahrer)}</span>
      <span class="model">${esc(a.modell)}</span>
    </button>`).join("");
  $("dots").innerHTML = AUTOS.map(() => "<i></i>").join("");
  const track = $("track");
  let raf;
  track.addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(updatePickIndex); });
  track.addEventListener("click", e => {
    const sl = e.target.closest(".slide"); if (!sl) return;
    const i = +sl.dataset.i;
    if (i === pickIndex) chooseCar(AUTOS[i].id); else scrollToCar(i);
  });
  $("goCar").addEventListener("click", () => chooseCar(AUTOS[pickIndex].id));
  $("prevCar").addEventListener("click", () => scrollToCar(Math.max(0, pickIndex - 1)));
  $("nextCar").addEventListener("click", () => scrollToCar(Math.min(AUTOS.length - 1, pickIndex + 1)));
  document.addEventListener("keydown", e => {
    if ($("picker").classList.contains("hidden")) return;
    if (e.key === "ArrowRight") scrollToCar(Math.min(AUTOS.length - 1, pickIndex + 1));
    if (e.key === "ArrowLeft") scrollToCar(Math.max(0, pickIndex - 1));
    if (e.key === "Enter") chooseCar(AUTOS[pickIndex].id);
  });
}
function updatePickIndex() {
  const track = $("track"), mid = track.scrollLeft + track.clientWidth / 2;
  let best = 0, dist = Infinity;
  [...track.children].forEach((el, i) => {
    const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
    if (d < dist) { dist = d; best = i; }
  });
  pickIndex = best;
  [...track.children].forEach((el, i) => el.classList.toggle("active", i === best));
  [...$("dots").children].forEach((el, i) => el.classList.toggle("on", i === best));
  $("goCar").setAttribute("aria-label", `${AUTOS[best].fahrer} auswählen`);
}
function scrollToCar(i, instant) {
  const el = $("track").children[i];
  $("track").scrollTo({ left: el.offsetLeft + el.offsetWidth / 2 - $("track").clientWidth / 2, behavior: instant ? "auto" : "smooth" });
  if (instant) updatePickIndex();
}
function openPicker() {
  $("picker").classList.remove("hidden", "closing");
  const start = Math.max(0, AUTOS.findIndex(a => a.id === state.car));
  requestAnimationFrame(() => scrollToCar(start, true));
}
function chooseCar(id) {
  state.car = id;
  saveState(true);   // Auswahl nur lokal merken
  renderCar();
  $("picker").classList.add("closing");
  setTimeout(() => { $("picker").classList.add("hidden"); focusSearch(); }, 300);
}
function renderCar() {
  const a = AUTO_BY_ID[state.car];
  $("carChip").innerHTML = a ? `<img src="${a.logo}" alt="${esc(a.modell)}">` : "";
  $("carChip").classList.toggle("wide", !!(a && a.breit));
  $("carSub").textContent = a ? `${a.fahrer} · ${a.modell}` : "";
}
$("carChip").addEventListener("click", openPicker);

function focusSearch() {
  if (ui.view === "liste" && $("picker").classList.contains("hidden")) $("q").focus({ preventScroll: true });
}
$("qEu").innerHTML = STARS + "<span>D</span>";
applyTheme();
buildPicker();
renderCar();
renderAll();
openPicker();
initSync();
</script>
